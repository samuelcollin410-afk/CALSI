name: Fix completion sync

on:
  push:
    paths:
      - '.github/workflows/fix-completion-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CALSI completion and cross-device sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('JS/app.js')
          s=p.read_text()

          def rep(old,new,count=1):
              global s
              if old not in s:
                  raise SystemExit('Missing patch target:\n'+old[:240])
              s=s.replace(old,new,count)

          rep(
          "import { cloudConfigured, observeAuth, signIn, signOutCloud, pushCloud, pullCloud } from './cloud.js';",
          "import { cloudConfigured, observeAuth, signIn, signOutCloud, pushCloud, pullCloud, watchCloud } from './cloud.js';"
          )

          rep(
          "let cloudTimer;\nfunction queueCloud(){ if(!state.auth.user||!state.auth.cloudEnabled) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(async()=>{try{state.auth.lastSync=await pushCloud(state.auth.user.uid,state);saveState(state);}catch(e){console.warn(e);}},700); }",
          "let cloudTimer, stopCloudWatch=null, cloudSyncUid=null;\nfunction queueCloud(){ if(!state.auth.user||!state.auth.cloudEnabled) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(async()=>{try{state.auth.lastSync=await pushCloud(state.auth.user.uid,state);saveState(state);}catch(e){console.warn('Cloud save failed',e);toast('Cloud save failed — local copy is still safe');}},350); }\n\nfunction assignmentStamp(a){ return Date.parse(a?.updatedAt||a?.completedAt||a?.createdAt||0)||0; }\nfunction mergeAssignments(local=[],remote=[]){\n  const merged=new Map(local.map(a=>[a.id,a]));\n  for(const r of remote||[]){\n    const l=merged.get(r.id);\n    if(!l){merged.set(r.id,r);continue;}\n    // Newest assignment change wins. Older saved copies can no longer undo completion.\n    merged.set(r.id,assignmentStamp(r)>assignmentStamp(l)?r:l);\n  }\n  return [...merged.values()];\n}\nfunction mergeRemoteState(remote,user){\n  if(!remote) return state;\n  const auth={user:{uid:user.uid,email:user.email,displayName:user.displayName},cloudEnabled:true,lastSync:remote.auth?.lastSync||state.auth.lastSync};\n  return {\n    ...defaultState(),\n    ...state,\n    ...remote,\n    assignments:mergeAssignments(state.assignments,remote.assignments||[]),\n    classes:Array.isArray(remote.classes)&&remote.classes.length?remote.classes:state.classes,\n    widgets:Array.isArray(remote.widgets)?remote.widgets:state.widgets,\n    settings:{...state.settings,...(remote.settings||{}),statusColors:{...state.settings.statusColors,...(remote.settings?.statusColors||{})},shortcuts:{...state.settings.shortcuts,...(remote.settings?.shortcuts||{})}},\n    ui:state.ui,\n    auth\n  };\n}\nasync function startCloudSync(user){\n  if(!user) return;\n  state.auth.user={uid:user.uid,email:user.email,displayName:user.displayName};\n  state.auth.cloudEnabled=true;\n  if(cloudSyncUid===user.uid&&stopCloudWatch){saveState(state);return;}\n  cloudSyncUid=user.uid;\n  if(stopCloudWatch){stopCloudWatch();stopCloudWatch=null;}\n  try{\n    const remote=await pullCloud(user.uid);\n    if(remote) state=mergeRemoteState(remote,user);\n    saveState(state);\n    render();\n    // Write the reconciled copy back so every device starts from the same truth.\n    state.auth.lastSync=await pushCloud(user.uid,state);\n    saveState(state);\n    stopCloudWatch=await watchCloud(user.uid,remoteState=>{\n      const before=JSON.stringify(state.assignments);\n      state=mergeRemoteState(remoteState,user);\n      saveState(state);\n      if(JSON.stringify(state.assignments)!==before) render();\n    });\n  }catch(e){\n    console.error('Cloud sync startup failed',e);\n    saveState(state);\n  }\n}"
          )

          rep(
          "subtasks:$('#aSubtasks').value.split('\\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>({id:a.subtasks?.[i]?.id||uid('sub'),done:/^\\[x\\]/i.test(line),text:line.replace(/^\\[(?:x| )\\]\\s*/i,'')}))}; if(item.status==='completed'",
          "subtasks:$('#aSubtasks').value.split('\\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>({id:a.subtasks?.[i]?.id||uid('sub'),done:/^\\[x\\]/i.test(line),text:line.replace(/^\\[(?:x| )\\]\\s*/i,'')})),updatedAt:new Date().toISOString()}; if(item.status==='completed'"
          )

          rep(
          "a.status='notStarted';a.completedAt=null;persist();closeDrawer();render();toast('Assignment restored');",
          "a.status='notStarted';a.completedAt=null;a.updatedAt=new Date().toISOString();persist();closeDrawer();render();toast('Assignment restored');"
          )

          rep(
          "function completeAssignment(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;const prev={status:a.status,completedAt:a.completedAt};a.status='completed';a.completedAt=new Date().toISOString();persist();closeDrawer();render();completionEffect(a);toast('Assignment completed','UNDO',()=>{a.status=prev.status;a.completedAt=prev.completedAt;persist();render();});}",
          "function completeAssignment(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;const prev={status:a.status,completedAt:a.completedAt,updatedAt:a.updatedAt};const now=new Date().toISOString();a.status='completed';a.completedAt=now;a.updatedAt=now;persist();closeDrawer();render();completionEffect(a);toast('Assignment completed','UNDO',()=>{a.status=prev.status;a.completedAt=prev.completedAt;a.updatedAt=new Date().toISOString();persist();render();});}"
          )

          rep(
          "async function handleCloudAction(){try{if(state.auth.user){await signOutCloud();state.auth.user=null;state.auth.cloudEnabled=false;persist(false);renderSettings();toast('Signed out of cloud sync');return;}if(!cloudConfigured())return toast('Add Firebase config values first');const user=await signIn();state.auth.user={uid:user.uid,email:user.email,displayName:user.displayName};state.auth.cloudEnabled=true;const remote=await pullCloud(user.uid);if(remote&&remote.assignments){if(confirm('Cloud data found. Replace this browser data with the cloud copy?')){const auth=state.auth;state={...defaultState(),...remote,auth};}}else await pushCloud(user.uid,state);persist(false);render();toast('Cloud sync connected');}catch(e){console.error(e);toast('Cloud sign-in failed');}}",
          "async function handleCloudAction(){try{if(state.auth.user){if(stopCloudWatch){stopCloudWatch();stopCloudWatch=null;}cloudSyncUid=null;await signOutCloud();state.auth.user=null;state.auth.cloudEnabled=false;persist(false);renderSettings();toast('Signed out of cloud sync');return;}if(!cloudConfigured())return toast('Add Firebase config values first');await signIn();toast('Signed in — syncing your latest progress');}catch(e){console.error(e);toast('Cloud sign-in failed');}}"
          )

          rep(
          "observeAuth(user=>{if(!user)return;state.auth.user={uid:user.uid,email:user.email,displayName:user.displayName};state.auth.cloudEnabled=true;saveState(state);});",
          "observeAuth(user=>{if(!user){if(stopCloudWatch){stopCloudWatch();stopCloudWatch=null;}cloudSyncUid=null;state.auth.user=null;state.auth.cloudEnabled=false;saveState(state);return;}startCloudSync(user);});"
          )

          p.write_text(s)
          PY
      - name: Commit sync fix
        run: |
          git config user.name "CALSI Sync Fix"
          git config user.email "actions@users.noreply.github.com"
          git add JS/app.js
          git commit -m "Fix completed assignment persistence across devices"
          git push
