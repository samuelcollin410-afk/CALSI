name: Activate Study v2
on:
  push:
    paths:
      - '.github/workflows/activate-study-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch CALSI to Study v2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('JS/app.js')
          s=p.read_text()
          old="import { renderStudy } from './study.js';"
          new="import { renderStudy } from './study-v2.js';"
          if old not in s:
              raise SystemExit('Study import target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit activation
        run: |
          git config user.name "CALSI Study Update"
          git config user.email "actions@users.noreply.github.com"
          git add JS/app.js
          git commit -m "Activate persistent quiz analytics and favorites"
          git push
