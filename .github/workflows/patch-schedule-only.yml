name: Patch schedule-only classes

on:
  push:
    paths:
      - '.github/workflows/patch-schedule-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CourseFlow schedule-only behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('JS/app.js')
          s = p.read_text()

          replacements = []

          replacements.append((
          "function actualStatus(a){ return state.settings.autoOverdue&&isPastDue(a)?'overdue':a.status; }\nfunction getClass(id){return state.classes.find(c=>c.id===id)||state.classes[0];}\nfunction statusMeta(status){return {label:STATUS_META[status]?.label||status,color:state.settings.statusColors?.[status]||STATUS_META[status]?.color||'#888'};}\nfunction activeAssignments(){return state.assignments.filter(a=>!['completed','skipped'].includes(a.status));}",
          "function getClass(id){return state.classes.find(c=>c.id===id)||state.classes[0];}\nfunction isScheduleOnly(a){return !!getClass(a.classId)?.scheduleOnly;}\nfunction scheduleDatePassed(a){return isScheduleOnly(a)&&a.dueDate&&a.dueDate<localISODate();}\nfunction actualStatus(a){ return !isScheduleOnly(a)&&state.settings.autoOverdue&&isPastDue(a)?'overdue':a.status; }\nfunction statusMeta(status){return {label:STATUS_META[status]?.label||status,color:state.settings.statusColors?.[status]||STATUS_META[status]?.color||'#888'};}\nfunction activeAssignments(){return state.assignments.filter(a=>!['completed','skipped'].includes(a.status)&&!scheduleDatePassed(a));}\nfunction dueAssignments(){return activeAssignments().filter(a=>!isScheduleOnly(a));}"
          ))

          replacements.append((
          "function nextDue(){ return sortAssignments(activeAssignments().filter(a=>a.dueDate),'dueSoonest')[0]; }\nfunction workloadForDate(iso){ const list=activeAssignments().filter(a=>a.dueDate===iso);",
          "function nextDue(){ return sortAssignments(dueAssignments().filter(a=>a.dueDate),'dueSoonest')[0]; }\nfunction workloadForDate(iso){ const list=dueAssignments().filter(a=>a.dueDate===iso);"
          ))

          replacements.append((
          "const thisWeek=activeAssignments().filter(a=>a.dueDate&&daysBetween(today,parseLocalDate(a.dueDate))>=0&&daysBetween(today,parseLocalDate(a.dueDate))<=6);",
          "const thisWeek=dueAssignments().filter(a=>a.dueDate&&daysBetween(today,parseLocalDate(a.dueDate))>=0&&daysBetween(today,parseLocalDate(a.dueDate))<=6);"
          ))

          replacements.append((
          "activeAssignments().filter(a=>actualStatus(a)==='overdue').length",
          "dueAssignments().filter(a=>actualStatus(a)==='overdue').length"
          ))

          replacements.append((
          "const count=activeAssignments().filter(a=>a.dueDate===iso).length;",
          "const count=dueAssignments().filter(a=>a.dueDate===iso).length;"
          ))

          replacements.append((
          "const all=state.assignments.filter(a=>a.classId===c.id&&a.points!=null),done=all.filter(a=>a.status==='completed')",
          "const all=state.assignments.filter(a=>a.classId===c.id&&a.points!=null&&!c.scheduleOnly),done=all.filter(a=>a.status==='completed')"
          ))

          replacements.append((
          "function assignmentCards(items){ return items.map(a=>{const c=getClass(a.classId),s=statusMeta(actualStatus(a));return `<div class=\"assignment-card\" data-open-assignment=\"${a.id}\" style=\"--class-color:${c.color}\"><div class=\"assignment-color\"></div><div class=\"assignment-main\"><div class=\"assignment-name\">${state.settings.showClassIcons?escapeHTML(c.icon||'')+' ':''}${escapeHTML(a.name)}</div><div class=\"assignment-meta\"><span>${escapeHTML(c.name)}</span>${a.dueDate?`<span>${escapeHTML(relativeDue(a.dueDate,a.dueTime))}</span>`:''}${a.points!=null?`<span>${a.points} pts</span>`:''}<span>${escapeHTML(s.label)}</span></div></div><div class=\"assignment-right\"><span class=\"status-dot\" style=\"--status-color:${s.color}\"></span><span class=\"priority-badge\">${escapeHTML(a.priority||'normal')}</span></div></div>`}).join(''); }",
          "function assignmentCards(items){ return items.map(a=>{const c=getClass(a.classId),schedule=!!c.scheduleOnly,s=schedule?{label:'Scheduled',color:c.color}:statusMeta(actualStatus(a));return `<div class=\"assignment-card\" data-open-assignment=\"${a.id}\" style=\"--class-color:${c.color}\"><div class=\"assignment-color\"></div><div class=\"assignment-main\"><div class=\"assignment-name\">${state.settings.showClassIcons?escapeHTML(c.icon||'')+' ':''}${escapeHTML(a.name)}</div><div class=\"assignment-meta\"><span>${escapeHTML(c.name)}</span>${a.dueDate?`<span>${schedule?'Scheduled '+escapeHTML(formatDate(a.dueDate,{month:'short',day:'numeric'})):escapeHTML(relativeDue(a.dueDate,a.dueTime))}</span>`:''}${a.points!=null?`<span>${a.points} pts</span>`:''}<span>${escapeHTML(s.label)}</span></div></div><div class=\"assignment-right\"><span class=\"status-dot\" style=\"--status-color:${s.color}\"></span><span class=\"priority-badge\">${schedule?'schedule':escapeHTML(a.priority||'normal')}</span></div></div>`}).join(''); }"
          ))

          replacements.append((
          "function renderAssignments(){ const f=state.ui.assignmentFilters, filtered=state.assignments.filter(a=>!['completed','skipped'].includes(a.status))",
          "function renderAssignments(){ const f=state.ui.assignmentFilters, filtered=activeAssignments()"
          ))

          replacements.append((
          "const c=getClass(a.classId),s=statusMeta(actualStatus(a)),done=",
          "const c=getClass(a.classId),s=c.scheduleOnly?{label:'Scheduled',color:c.color}:statusMeta(actualStatus(a)),done="
          ))

          replacements.append((
          "${a.dueDate?`<div><strong>Due</strong><div class=\"muted mt-8\">${escapeHTML(formatLongDate(a.dueDate))}${a.dueTime?' • '+escapeHTML(formatTime(a.dueTime)):''}</div></div>`:''}",
          "${a.dueDate?`<div><strong>${c.scheduleOnly?'Scheduled':'Due'}</strong><div class=\"muted mt-8\">${escapeHTML(formatLongDate(a.dueDate))}${a.dueTime?' • '+escapeHTML(formatTime(a.dueTime)):''}</div>${c.scheduleOnly?'<div class=\"subtle mt-8\">Schedule-only item — not counted as a deadline and hides after this date.</div>':''}</div>`:''}"
          ))

          replacements.append((
          "<div class=\"subtle\">${items.length} assignment${items.length===1?'':'s'} due</div>",
          "<div class=\"subtle\">${items.length} item${items.length===1?'':'s'} scheduled for this day</div>"
          ))

          replacements.append((
          "function openClassForm(id=null){const c=id?getClass(id):{id:uid('class'),name:'',color:'#5d8cff',icon:'📚',teacher:'',room:'',period:'',semester:'Full Year',notes:'',link:''};",
          "function openClassForm(id=null){const c=id?getClass(id):{id:uid('class'),name:'',color:'#5d8cff',icon:'📚',teacher:'',room:'',period:'',semester:'Full Year',notes:'',link:'',scheduleOnly:false};"
          ))

          replacements.append((
          "<div class=\"field span-2\"><label>Notes</label><textarea id=\"cNotes\">${escapeHTML(c.notes||'')}</textarea></div></div>",
          "<div class=\"field span-2\"><label>Notes</label><textarea id=\"cNotes\">${escapeHTML(c.notes||'')}</textarea></div><div class=\"field span-2\"><div class=\"switch-row\"><div><strong>Schedule-only class</strong><div class=\"subtle mt-8\">Items still appear around the site, but do not count as deadlines, never become overdue, and automatically hide after their scheduled date passes.</div></div><div id=\"cScheduleOnly\" class=\"switch ${c.scheduleOnly?'on':''}\"></div></div></div></div>"
          ))

          replacements.append((
          "const next={...c,name,color:$('#cColor').value,icon:$('#cIcon').value||'📚',teacher:$('#cTeacher').value,room:$('#cRoom').value,period:$('#cPeriod').value,semester:$('#cSemester').value,link:$('#cLink').value,notes:$('#cNotes').value};",
          "const next={...c,name,color:$('#cColor').value,icon:$('#cIcon').value||'📚',teacher:$('#cTeacher').value,room:$('#cRoom').value,period:$('#cPeriod').value,semester:$('#cSemester').value,link:$('#cLink').value,notes:$('#cNotes').value,scheduleOnly:$('#cScheduleOnly')?.classList.contains('on')||false};"
          ))

          replacements.append((
          "if(id&&id!=='general')$('#deleteClass').onclick=()=>confirmModal",
          "$('#cScheduleOnly')?.addEventListener('click',e=>e.currentTarget.classList.toggle('on'));if(id&&id!=='general')$('#deleteClass').onclick=()=>confirmModal"
          ))

          missed=[]
          for old,new in replacements:
              if old not in s:
                  missed.append(old[:120])
              else:
                  s=s.replace(old,new,1)
          if missed:
              raise SystemExit('Patch targets missing:\n'+'\n---\n'.join(missed))
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "CourseFlow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add JS/app.js
          git commit -m "Add schedule-only class behavior"
          git push
